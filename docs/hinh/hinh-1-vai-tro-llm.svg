>Thu nhập bình quân một lao động đang làm việc</text><text x="474" y="220" text-anchor="end" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#8A8984">63 tỉnh · 2018–2024</text><text x="30" y="235" text-anchor="start" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#4A42A8">a2</text><text x="52" y="235" text-anchor="start" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#444441">Thu nhập bình quân đầu người một tháng</text><text x="474" y="235" text-anchor="end" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#8A8984">63 tỉnh · 2010–2018</text><text x="30" y="250" text-anchor="start" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#4A42A8">a3</text><text x="52" y="250" text-anchor="start" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#444441">…</text><text x="474" y="250" text-anchor="end" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#8A8984"></text><text x="30" y="272" text-anchor="start" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#8A8984" font-style="italic">Mỗi dòng là một chỉ tiêu (một cột số trong một bảng). LLM chọn mã dòng, vd “a1”, hoặc “không có”.</text><rect x="20" y="300" width="640" height="123" rx="2" fill="#FFFFFF" stroke="#B9B4EE" stroke-dasharray="3 2"/><path d="M539.0 86 L539.0 298" fill="none" stroke="#8A8984" stroke-width="1" stroke-dasharray="2 3" marker-end="url(#a)"/><text x="30" y="314" text-anchor="start" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#444441">Ví dụ 2 — tính số, viết insight, kiểm tra lỗi (diện tích lúa cả nước: 1995: 6,77 · 2013: 7,90 · 2024: 7,13 triệu ha)</text><rect x="30" y="327" width="10" height="10" rx="2" fill="#EFEEFC" stroke="#B9B4EE"/><text x="46" y="332" text-anchor="start" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#444441">Tính số</text><text x="160" y="332" text-anchor="start" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#444441">1995–2013: tăng 17% · 2013–2024: giảm 10%</text><rect x="30" y="344" width="10" height="10" rx="2" fill="#EEF5E6" stroke="#A8CC86"/><text x="46" y="349" text-anchor="start" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#444441">Viết insight (lần 1)</text><text x="160" y="349" text-anchor="start" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#444441">“Diện tích lúa giảm từ 6,77 triệu ha xuống còn 7,13 triệu ha.”</text><rect x="30" y="361" width="10" height="10" rx="2" fill="#EFEEFC" stroke="#B9B4EE"/><text x="46" y="366" text-anchor="start" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#444441">Kiểm tra lỗi</text><text x="160" y="366" text-anchor="start" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#A32D2D">✗ Câu nói “giảm” nhưng 7,13 lớn hơn 6,77 → trả về viết lại</text><rect x="30" y="378" width="10" height="10" rx="2" fill="#EEF5E6" stroke="#A8CC86"/><text x="46" y="383" text-anchor="start" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#444441">Viết insight (lần 2)</text><text x="160" y="383" text-anchor="start" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#444441">“Diện tích lúa tăng 17% từ 1995 đến 2013, rồi giảm 10% đến 2024.”</text><rect x="30" y="395" width="10" height="10" rx="2" fill="#EFEEFC" stroke="#B9B4EE"/><text x="46" y="400" text-anchor="start" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#444441">Kiểm tra lỗi</text><text x="160" y="400" text-anchor="start" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#3B6D11">✓ Hướng tăng/giảm khớp với số đã tính → trả lời</text><rect x="20" y="440" width="10" height="10" rx="2" fill="#EEF5E6" stroke="#A8CC86"/><text x="36" y="445" text-anchor="start" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">LLM call</text><rect x="120" y="440" width="10" height="10" rx="2" fill="#EFEEFC" stroke="#B9B4EE"/><text x="136" y="445" text-anchor="start" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">Gate / tool (chương trình)</text><rect x="300" y="440" width="10" height="10" rx="5" fill="#FBEEE9" stroke="#F0A98F"/><text x="316" y="445" text-anchor="start" dominant-baseline="central" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">Vào / ra</text></svg>