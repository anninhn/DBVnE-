title: Diện tích rừng trồng mới tập trung phân theo loại hình kinh tế
slug: dien-tich-rung-trong-moi-tap-trung-phan-theo-loai-hinh-kinh
description: 'Diện tích rừng trồng mới tập trung hằng năm của Việt Nam, tách
  theo loại hình kinh tế của đơn vị trồng (Nhà nước, ngoài Nhà nước, khu vực có
  vốn đầu tư nước ngoài), giai đoạn 2018–2023. Kèm chỉ số phát triển so với năm
  trước. LƯU Ý VỀ ĐƠN VỊ: bản export gốc của Cục Thống kê ghi cột số liệu là
  "Sản lượng (Nghìn m3)", nhưng đó là lỗi nhãn của nguồn — giá trị là DIỆN TÍCH,
  đơn vị nghìn ha. Đối chiếu ba dataset cùng chỉ tiêu cho giá trị y hệt ở mọi
  năm 2018–2023 (282 · 268 · 269 · 290 · 306 · 296), và hai dataset kia ghi đơn
  vị nghìn ha.'
